[project]
name = "radar-prf-101"
version = "0.2.0"
description = "Data ingestion and analysis utilities for PRF accident datasets."
readme = "README.md"
requires-python = "==3.13.*"
authors = [
    {name = "Arthur Wolmer", email = "arthur.wolmer@gmail.com"},
]
dependencies = [
    "dvc>=3.67.0",
    "geopandas>=1.1.3",
    "holidays>=0.92",
    "ipykernel>=7.2.0",
    "ipython>=9.10.0",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "mlflow>=1.27.0",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.uv]

[tool.ruff]
lint.extend-select = [
    "UP", 
    "I", 
    "ICN", 
    "TID"
] 
target-version = "py313"
