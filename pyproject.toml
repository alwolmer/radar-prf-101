[project]
name = "radar-prf-101"
version = "0.2.0"
description = "Data ingestion and analysis utilities for PRF accident datasets."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Arthur Wolmer", email = "arthur.wolmer@gmail.com"},
]
dependencies = [
    "apache-sedona==1.5.1",
    "boto3>=1.40.0",
    "dvc>=3.67.0",
    "geopandas>=1.1.3",
    "holidays>=0.92",
    "ipykernel>=7.2.0",
    "ipython>=9.10.0",
    "ipywidgets>=8.1.8",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "mlflow>=3.11.1",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "polars>=1.38.1",
    "protobuf>=6.33.6",
    "pyarrow>=23.0.1",
    "pyspark==3.5.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.uv]

[tool.ruff]
lint.extend-select = [
    "UP", 
    "I", 
    "ICN", 
    "TID"
] 
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]
