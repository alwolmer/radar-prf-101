stages:
  prf_source2bronze:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.bronze.prf_source2bronze
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/bronze/prf_source2bronze.py
    outs:
      - data/bronze/prf_accidents
  dnit_source2bronze:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.bronze.dnit_source2bronze
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/bronze/dnit_source2bronze.py
    outs:
      - data/bronze/dnit_road_network
  prf_bronze2silver:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.silver.prf_bronze2silver
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/silver/prf_bronze2silver.py
      - data/bronze/prf_accidents
    outs:
      - data/silver/prf_accidents_standardized
  dnit_bronze2silver:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.silver.dnit_bronze2silver
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/silver/dnit_bronze2silver.py
      - data/bronze/dnit_road_network
    outs:
      - data/silver/dnit_br101_corridor
  ibge_municipios_src2bronze:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.bronze.ibge_municipios_src2bronze
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/bronze/ibge_utils.py
      - src/etl/bronze/ibge_municipios_src2bronze.py
    outs:
      - data/bronze/ibge/municipios

  ibge_rgi_src2bronze:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.bronze.ibge_rgi_src2bronze
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/bronze/ibge_utils.py
      - src/etl/bronze/ibge_rgi_src2bronze.py
    outs:
      - data/bronze/ibge/rgi
  ibge_bronze2silver:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.silver.ibge_bronze2silver
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/silver/ibge_bronze2silver.py
      - data/bronze/ibge/municipios
      - data/bronze/ibge/rgi
    outs:
      - data/silver/ibge_territorial_preprocessed
  br101_sc_municipio_silver2gold:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.gold.br101_sc_municipio_silver2gold
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/gold/__init__.py
      - src/etl/gold/br101_sc_municipio_silver2gold.py
      - data/silver/prf_accidents_standardized
      - data/silver/dnit_br101_corridor
      - data/silver/ibge_territorial_preprocessed/municipalities_preprocessed
    outs:
      - data/gold/br101_sc_municipio_panel
  municipio_day_featurize:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.ml.municipio_day_regression featurize
    deps:
      - pyproject.toml
      - uv.lock
      - src/ml/municipio_day_regression.py
      - config/ml/municipio_day/featurization.yaml
      - data/gold/br101_sc_municipio_panel
    outs:
      - data/gold/ml/municipio_day_features
