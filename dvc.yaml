stages:
  prf_source2bronze:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.bronze.prf_source2bronze
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/bronze/prf_source2bronze.py
    outs:
      - data/bronze/prf_accidents
  dnit_source2bronze:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.bronze.dnit_source2bronze
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/bronze/dnit_source2bronze.py
    outs:
      - data/bronze/dnit_road_network
  prf_bronze2silver:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.silver.prf_bronze2silver
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/silver/prf_bronze2silver.py
      - data/bronze/prf_accidents
    outs:
      - data/silver/prf_accidents_standardized
  dnit_bronze2silver:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.silver.dnit_bronze2silver
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/silver/dnit_bronze2silver.py
      - data/bronze/dnit_road_network
    outs:
      - data/silver/dnit_br101_corridor
  ibge_mun_bronze2silver:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.silver.ibge_mun_bronze2silver
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/sedona_session.py
      - src/etl/transform/geospatial.py
      - src/etl/silver/ibge_base.py
      - src/etl/silver/ibge_mun_bronze2silver.py
      - data/bronze/ibge_territorial
    outs:
      - data/silver/municipalities
  ibge_rgi_bronze2silver:
    cmd: DATALAKE_BACKEND=local DATALAKE_LOCAL_ROOT=data UV_CACHE_DIR=/tmp/uv-cache uv run python -m src.etl.silver.ibge_rgi_bronze2silver
    deps:
      - pyproject.toml
      - uv.lock
      - src/etl/base_job.py
      - src/etl/datalake.py
      - src/etl/sedona_session.py
      - src/etl/transform/geospatial.py
      - src/etl/silver/ibge_base.py
      - src/etl/silver/ibge_rgi_bronze2silver.py
      - data/bronze/ibge_territorial
    outs:
      - data/silver/rgis
